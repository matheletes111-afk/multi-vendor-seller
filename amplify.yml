version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps --include=dev
        - npm install --legacy-peer-deps --include=dev --os=linux --cpu=x64 sharp
        # Write environment variables to .env for Next.js runtime
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env
        - echo "AUTH_URL=$AUTH_URL" >> .env
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env
        - echo "AUTH_SECRET=$NEXTAUTH_SECRET" >> .env
        - echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> .env
        - echo "STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" >> .env
        - echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" >> .env
        - echo "NODE_ENV=$NODE_ENV" >> .env
        - echo "SENDGRID_API_KEY=$SENDGRID_API_KEY" >> .env
        - echo "EMAIL_SERVICE=$EMAIL_SERVICE" >> .env
        - echo "SENDGRID_FROM_EMAIL=$SENDGRID_FROM_EMAIL" >> .env
        - echo "MOBILE_JWT_SECRET_KEY=$MOBILE_JWT_SECRET_KEY" >> .env
        - echo "MOBILE_REFRESH_SECRET_KEY=$MOBILE_REFRESH_SECRET_KEY" >> .env
        - echo "AUTH_GOOGLE_ID=$AUTH_GOOGLE_ID" >> .env
        - echo "AUTH_GOOGLE_SECRET=$AUTH_GOOGLE_SECRET" >> .env
        - echo "AUTH_FACEBOOK_ID=$AUTH_FACEBOOK_ID" >> .env
        - echo "AUTH_FACEBOOK_SECRET=$AUTH_FACEBOOK_SECRET" >> .env
        - echo "AMPLIFY_AWS_ACCESS_KEY_ID=${AMPLIFY_AWS_ACCESS_KEY_ID:-$AWS_ACCESS_KEY_ID}" >> .env
        - echo "AMPLIFY_AWS_SECRET_ACCESS_KEY=${AMPLIFY_AWS_SECRET_ACCESS_KEY:-$AWS_SECRET_ACCESS_KEY}" >> .env
        - echo "AMPLIFY_AWS_REGION=${AMPLIFY_AWS_REGION:-$AWS_REGION}" >> .env
        - echo "AMPLIFY_AWS_S3_BUCKET_NAME=${AMPLIFY_AWS_S3_BUCKET_NAME:-$S3_BUCKET}" >> .env
        - echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-$AMPLIFY_AWS_ACCESS_KEY_ID}" >> .env
        - echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-$AMPLIFY_AWS_SECRET_ACCESS_KEY}" >> .env
        - echo "AWS_REGION=${AWS_REGION:-$AMPLIFY_AWS_REGION}" >> .env
        - echo "S3_BUCKET=${S3_BUCKET:-$AMPLIFY_AWS_S3_BUCKET_NAME}" >> .env
        - echo "S3_PUBLIC_BASE_URL=$S3_PUBLIC_BASE_URL" >> .env
        - echo "NEXT_PUBLIC_LIVE_SITE_URL=$NEXT_PUBLIC_LIVE_SITE_URL" >> .env
        - echo "NEXT_PUBLIC_SOCKET_URL=$NEXT_PUBLIC_SOCKET_URL" >> .env
        - echo "ACC_SID_TWILIO=$ACC_SID_TWILIO" >> .env
        - echo "AUTH_TOKEN_TWILIO=$AUTH_TOKEN_TWILIO" >> .env
        - echo "MSG_SERVICESID=$MSG_SERVICESID" >> .env
        - echo "MAP_KEY=$MAP_KEY" >> .env
        - echo "INTERNAL_API_SECRET=$INTERNAL_API_SECRET" >> .env
        - echo "CRON_SECRET=$CRON_SECRET" >> .env
        - echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" >> .env
        - echo "FIREBASE_CLIENT_EMAIL=$FIREBASE_CLIENT_EMAIL" >> .env
        - echo "FIREBASE_PRIVATE_KEY=$FIREBASE_PRIVATE_KEY" >> .env
        - echo "FIREBASE_PRIVATE_KEY_BASE64=$FIREBASE_PRIVATE_KEY_BASE64" >> .env
        # Flot Payment Gateway
        - echo "FLOT_BASE_URL=$FLOT_BASE_URL" >> .env
        - echo "FLOT_MERCHANT_ID=$FLOT_MERCHANT_ID" >> .env
        - echo "FLOT_PRIVATE_KEY=$FLOT_PRIVATE_KEY" >> .env
        - echo "FLOT_PRIVATE_KEY_BASE64=$FLOT_PRIVATE_KEY_BASE64" >> .env
        - echo "FLOT_WEBHOOK_USERNAME=$FLOT_WEBHOOK_USERNAME" >> .env
        - echo "FLOT_WEBHOOK_PASSWORD=$FLOT_WEBHOOK_PASSWORD" >> .env
        - node -e 'if (process.env.FLOT_PRIVATE_KEY && !process.env.FLOT_PRIVATE_KEY_BASE64) { require("fs").appendFileSync(".env", "\nFLOT_PRIVATE_KEY=" + JSON.stringify(process.env.FLOT_PRIVATE_KEY) + "\n"); }' 2>/dev/null || true
        # Apple In-App Purchase (StoreKit 2)
        - echo "APPLE_IAP_ISSUER_ID=$APPLE_IAP_ISSUER_ID" >> .env
        - echo "APPLE_IAP_KEY_ID=$APPLE_IAP_KEY_ID" >> .env
        - echo "APPLE_IAP_PRIVATE_KEY=$APPLE_IAP_PRIVATE_KEY" >> .env
        - echo "APPLE_BUNDLE_ID=$APPLE_BUNDLE_ID" >> .env
        - echo "APPLE_APP_ID=$APPLE_APP_ID" >> .env
        - echo "APPLE_ENVIRONMENT=$APPLE_ENVIRONMENT" >> .env
        - npx prisma generate
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        # Prune compiler cache and sourcemaps to stay below AWS Amplify 220MB (230686720 bytes) artifact limit
        - rm -rf .next/cache
        - rm -rf .next/standalone
        - find .next -name "*.map" -type f -delete 2>/dev/null || true
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
